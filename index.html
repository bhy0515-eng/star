        function saveStateToLocalStorage() {
            try {
                localStorage.setItem('teacher_eval_practice_state_v4', JSON.stringify(appState));
            } catch (e) {
                console.error('LocalStorage save error', e);
            }
        }

        function loadStateFromLocalStorage() {
            try {
                const saved = localStorage.getItem('teacher_eval_practice_state_v4');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState = { ...appState, ...parsed };
                }
            } catch (e) {
                console.error('LocalStorage load error', e);
            }
        }

        function confirmResetCurrentSubjectData() {

                    appState.teacherReflections[appState.selectedSubjectId] = { reasonDiff: '', sentenceDiff: '', q1: '', q2: '', q3: '', q4: '' };
                    
                    // Reset to step 1 as requested
                    appState.currentStep = 1;

                    showToast('데이터가 초기화되어 첫 화면으로 이동했습니다.');

        /**

         */
        function changeSubject(subjectId) {
            appState.selectedSubjectId = subjectId;
            appState.currentStep = 1; // Always navigate to Step 1 upon subject change
            closeSubjectModal();
            saveStateToLocalStorage();
            showToast(`${PRACTICE_SUBJECTS[subjectId].badgeText}(으)로 변경되어 첫 화면으로 이동합니다.`);
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==========================================
        // STEP CONTROLLER & NAVIGATION
        // ==========================================
        function goToStep(stepNumber) {
            if (stepNumber < 1 || stepNumber > 6) return;

            // Step Guards: Ensure teacher completes necessary fields before moving forward
            if (stepNumber >= 5 && appState.currentStep === 4) {
                const curSubj = appState.selectedSubjectId;
                const j = appState.judgments[curSubj];
                if (!j[1].level || !j[2].level || !j[3].level) {
                    openCustomAlert('필수 단계 확인', '모든 학생(①, ②, ③)의 성취수준(A/B/C)을 먼저 선택해 주세요!');
                    return;
                }
            }

            if (stepNumber === 6) {
                const curSubj = appState.selectedSubjectId;
                const c = appState.comments[curSubj];
                if (!c[1].trim() || !c[2].trim() || !c[3].trim()) {
                    openCustomConfirm(
                        '미작성 항목 안내',
                        '아직 일부 학생의 성취수준 및 특기사항이 작성되지 않았습니다. AI 비교 단계로 계속 이동하시겠습니까?',
                        () => {
                            executeStepChange(stepNumber);
                        }
                    );
                    return;
                }
            }

            executeStepChange(stepNumber);
        }

        function executeStepChange(stepNumber) {
            appState.currentStep = stepNumber;
            updateMissionStatus();
            saveStateToLocalStorage();
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateMissionStatus() {
            if (appState.currentStep >= 2) appState.missions.step2Done = true;
            if (appState.currentStep >= 3) appState.missions.step3Done = true;
            
            const curSubj = appState.selectedSubjectId;
            const j = appState.judgments[curSubj];
            if (j[1].level && j[2].level && j[3].level) appState.missions.step4Done = true;

            const c = appState.comments[curSubj];
            if (c[1] && c[2] && c[3]) appState.missions.step5Done = true;

            if (appState.currentStep === 6) appState.missions.step6Done = true;
        }

        // Custom UI Modal Handlers
        function openCustomAlert(title, message) {
            document.getElementById('alert-modal-title').innerText = title;
            document.getElementById('alert-modal-message').innerText = message;
            document.getElementById('custom-alert-modal').classList.remove('hidden');
        }
        function closeCustomAlert() {
            document.getElementById('custom-alert-modal').classList.add('hidden');
        }

        function openCustomConfirm(title, message, onOk) {
            document.getElementById('confirm-modal-title').innerText = title;
            document.getElementById('confirm-modal-message').innerText = message;
            
            const cancelBtn = document.getElementById('confirm-modal-cancel-btn');
            const okBtn = document.getElementById('confirm-modal-ok-btn');

            const modal = document.getElementById('custom-confirm-modal');
            modal.classList.remove('hidden');

            const close = () => modal.classList.add('hidden');

            cancelBtn.onclick = () => close();
            okBtn.onclick = () => {
                close();
                if (onOk) onOk();
            };
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            if (toast && toastMsg) {
                toastMsg.innerText = msg;
                toast.classList.remove('translate-y-16', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
                setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-16', 'opacity-0');
                }, 2500);
            }
        }

        // Modal Helpers
        function openSubjectModal() {
            renderSubjectModalOptions();
            document.getElementById('subject-modal').classList.remove('hidden');
        }
        function closeSubjectModal() {
            document.getElementById('subject-modal').classList.add('hidden');
        }

        // ==========================================
        // RENDER ROUTINER
        // ==========================================
        function renderApp() {
            renderHeaderProgress();
            const container = document.getElementById('app-container');
            
            switch (appState.currentStep) {
                case 1:
                    container.innerHTML = renderStep1Guide();
                    break;
                case 2:
                    container.innerHTML = renderStep2Criteria();
                    break;
                case 3:
                    container.innerHTML = renderStep3StudentData();
                    break;
                case 4:
                    container.innerHTML = renderStep4Judgment();
                    break;
                case 5:
                    container.innerHTML = renderStep5CommentWriting();
                    break;
                case 6:
                    container.innerHTML = renderStep6AIComparison();
                    break;
                default:
                    container.innerHTML = renderStep1Guide();
            }
        }

        function renderHeaderProgress() {
            const subject = PRACTICE_SUBJECTS[appState.selectedSubjectId];
            document.getElementById('current-subject-display-badge').innerText = subject.badgeText;

            const percent = (appState.currentStep / 6) * 100;
            document.getElementById('progress-bar-fill').style.width = `${percent}%`;

            const namesContainer = document.getElementById('step-names-container');
            namesContainer.innerHTML = STEP_NAMES.map((name, idx) => {
                const stepNum = idx + 1;
                const isActive = stepNum === appState.currentStep;
                const isPassed = stepNum < appState.currentStep;
                
                let textColor = 'text-slate-400';
                if (isActive) textColor = 'text-blue-600 font-bold scale-105 transform';
                else if (isPassed) textColor = 'text-slate-700 font-medium';

                return `
                    <span class="${textColor} cursor-pointer hover:text-blue-500 transition-all text-[11px] sm:text-xs" onclick="goToStep(${stepNum})">
                        ${isPassed ? '<i class="fa-solid fa-circle-check text-blue-500 mr-0.5"></i>' : ''}${name}
                    </span>
                `;
            }).join('');
        }

                `;
            }).join('');
        }

                                            </strong>
                                            <ul class="text-[11px] text-amber-900/90 space-y-1 pl-1">
                                                <li>· 작성 내용이 3단계 학생 자료(수행 내용·관찰 기록)에 근거하고 있는가?</li>
                                                <li>· 학생의 실제 수행 수준보다 과도하게 높거나 낮게 표현되지 않았는가?</li>
                                                <li>· 성취기준과 학생 수행 내용이 연결되어 있는가?</li>
                                                <li>· 학생의 학습활동 참여와 변화·성장이 적절하게 드러나는가?</li>
                                                <li>· 3단계 자료에 없는 내용을 임의로 추가하지 않았는가?</li>
                                                <li>· 동일하거나 반복적인 표현이 지나치게 사용되지 않았는가?</li>
                                            </ul>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Synthesis Reflection Questions -->
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-5">
                        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-3">
                            <i class="fa-solid fa-comments text-blue-600"></i> 3) 연수 종합 성찰 질문 및 기록
                        </h3>

                        <div class="space-y-4 text-xs">
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-800 block">
                                    Q1. 성취수준을 판단할 때 가장 중요하게 본 수행평가지 근거는 무엇인가요?
                                </label>
                                <textarea rows="2" 
                                          oninput="setReflectionText('${appState.selectedSubjectId}', 'q1', this.value)"
                                          placeholder="예: 교육과정 성취기준의 핵심 수행요소 완수 여부와 학생의 자발성..."
                                          class="w-full p-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500">${reflections.q1 || ''}</textarea>
                            </div>

                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-800 block">
                                    Q2. 수행평가 결과물과 수업 관찰 결과가 다를 경우 교사는 어떻게 판단해야 하는가?
                                </label>
                                <textarea rows="2" 
                                          oninput="setReflectionText('${appState.selectedSubjectId}', 'q2', this.value)"
                                          placeholder="예: 지필적 포맷 외에 평소 수업 중 보여준 지속적인 관찰 기록을 상호 보완하여 관찰 근거를 보강함..."
                                          class="w-full p-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500">${reflections.q2 || ''}</textarea>
                            </div>

                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-800 block">
                                    Q3. AI가 제안한 특기사항 문장에서 실제 관찰 근거에 없는 과장된 표현이 포함되어 있지는 않나요?
                                </label>
                                <textarea rows="2" 
                                          oninput="setReflectionText('${appState.selectedSubjectId}', 'q3', this.value)"
                                          placeholder="예: AI의 표현 중 '매우 뛰어남'과 같은 추상적 미화 수식어를 삭제하고 실제 관찰된 행동 중심 문장으로 정제함..."
                                          class="w-full p-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500">${reflections.q3 || ''}</textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Final Summary Report Generator -->
                    <div class="bg-blue-900 text-white p-6 rounded-2xl space-y-4 shadow-xl">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <h3 class="font-bold text-base text-white flex items-center gap-2">
                                <i class="fa-solid fa-award text-yellow-400"></i> 나의 실습 종합 결과 리포트
                            </h3>
                            <div class="flex flex-wrap items-center gap-2">
                                <button onclick="copyCommentsOnly()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition-all shadow-md flex items-center gap-1.5">
                                    <i class="fa-solid fa-copy"></i> 성취수준 및 특기사항만 복사
                                </button>
                                <button onclick="copyFullReport()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition-all shadow-md flex items-center gap-1.5">
                                    <i class="fa-solid fa-file-export"></i> 전체 실습 리포트 복사
                                </button>
                            </div>
                        </div>
                        <p class="text-xs text-blue-200">
                            연수가 완료되었습니다. [성취수준 및 특기사항만 복사]를 누르면 완성된 학생별 특기사항 문장만 추출할 수 있으며, [전체 실습 리포트 복사]를 누르면 판단 근거와 성찰 일지를 포함한 전체 보고서가 클립보드로 복사됩니다.
                        </p>
                    </div>

                    <!-- Navigation Controls -->
                    <div class="flex items-center justify-between pt-2">
                        <button onclick="goToStep(5)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs px-4 py-3 rounded-xl transition-colors">
                            <i class="fa-solid fa-arrow-left mr-1"></i> 이전 (성취수준 및 특기사항 작성)
                        </button>
                        <button onclick="openCustomAlert('실습 완료', '수고하셨습니다! 성취수준 및 특기사항 작성 연수 실습이 성공적으로 마쳐졌습니다.')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-6 py-3.5 rounded-xl shadow-lg transition-all flex items-center gap-2">
                            <i class="fa-solid fa-check"></i>
                            <span>연수 실습 완료</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function setReflectionText(subjId, fieldKey, val) {
            appState.teacherReflections[subjId][fieldKey] = val;
            saveStateToLocalStorage();
        }

        /**
         * REQUIREMENT: Explicit handler to save final comment in Step 6
         */
        function saveFinalComment(stId) {
            const input = document.getElementById(`final-input-${stId}`);
            if (input) {
                const val = input.value.trim();
                setTeacherComment(appState.selectedSubjectId, stId, val);
                showToast(`[학생 ${stId}] 최종 성취수준 및 특기사항 문장이 저장되었습니다.`);
            }
        }

        function applyAiToFinal(stId, aiText) {
            const input = document.getElementById(`final-input-${stId}`);
            if (input) {
                input.value = aiText;
                setTeacherComment(appState.selectedSubjectId, stId, aiText);
                showToast(`[학생 ${stId}] 문장에 AI 제안 문장이 반영 및 저장되었습니다.`);
            }
        }

        function escapeJsString(str) {
            if (!str) return '';
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ');
        }

        function copyToClipboard(text) {
            if (!text) return;
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            showToast('클립보드에 복사되었습니다.');
        }

        function copyCommentsOnly() {
            const subject = PRACTICE_SUBJECTS[appState.selectedSubjectId];
            const judgments = appState.judgments[appState.selectedSubjectId];
            const comments = appState.comments[appState.selectedSubjectId];

            let text = `[${subject.title} - 성취수준 및 특기사항]\n\n`;
            [1, 2, 3].forEach(stId => {
                const student = subject.students[stId];
                const lvl = judgments[stId].level || '미지정';
                text += `${student.id} (성취수준: ${lvl}): ${comments[stId] || '(미작성)'}\n\n`;
            });

            copyToClipboard(text.trim());
        }

        function copyFullReport() {
            const subject = PRACTICE_SUBJECTS[appState.selectedSubjectId];
            const judgments = appState.judgments[appState.selectedSubjectId];
            const comments = appState.comments[appState.selectedSubjectId];
            const reflections = appState.teacherReflections[appState.selectedSubjectId];

            let report = `[성취수준 및 특기사항 작성 실습 연수 결과 보고서]\n`;
            report += `실습 과목: ${subject.title}\n`;
            report += `성취기준: ${subject.achievementStandard}\n\n`;

            [1, 2, 3].forEach(stId => {
                const student = subject.students[stId];
                const lvl = judgments[stId].level || '미지정';
                const reason = judgments[stId].reason || '(근거 미작성)';
                const comment = comments[stId] || '(특기사항 미작성)';
                report += `■ ${student.id}\n- 지정 성취수준: ${lvl}\n- 교사 판단 근거: ${reason}\n- 성취수준 및 특기사항: ${comment}\n\n`;
            });

            report += `■ 연수 성찰 기록\n`;
            report += `Q1. 판단 근거: ${reflections.q1 || '-'}\n`;
            report += `Q2. 결과물과 관찰 차이 시 판단: ${reflections.q2 || '-'}\n`;
            report += `Q3. AI 제안 검토 및 정제 소견: ${reflections.q3 || '-'}\n`;

            copyToClipboard(report.trim());
        }
    </script>
</body>
</html>
